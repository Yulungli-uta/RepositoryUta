[project]
name = "repositoryuta"
version = "0.1.0"
description = "Migracion progresiva de RepositoryUta a FastAPI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyodbc==5.3.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["repositoryuta"]

[tool.coverage.report]
fail_under = 80
show_missing = true
