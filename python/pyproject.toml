[project]
name = "repositoryuta"
version = "0.1.0"
description = "Migracion progresiva de RepositoryUta a FastAPI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bcrypt==4.3.0",
  "fastapi==0.141.1",
  "ldap3==2.9.1",
  "msal==1.31.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.10.1",
  "pyodbc==5.3.0",
  "slowapi==0.1.10",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends()/Header()/etc. como valor por defecto a proposito (es
# el mecanismo de inyeccion de dependencias) — no es el antipatron que B008
# busca detectar.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "repositoryuta.routers.dependencies.require_roles",
]

[tool.coverage.run]
branch = true
source = ["repositoryuta"]

[tool.coverage.report]
fail_under = 80
show_missing = true
